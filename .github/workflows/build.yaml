name: Build and Test Github Workflow

on:
  push:
    branches:
      - main
      - github-actions
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    # - name: test SSH connection
    #   run: | # ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} 'echo "This is a successful SSH connection test" >> myname2.txt'
    #     ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<EOF
    #       echo "This is a successful SSH connection test" >> myname2.txt
    #       cd emraay-airlines
    #       git pull origin github-actions
    #       git checkout github-actions
    #       npm install
    #       npm run build
    #       npm start &
    #       curl -f http://localhost:3000 || exit 1
          
    #       EOF
    - name: test SSH connection and deploy App
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<'EOF'
          set -euo pipefail

          echo "This is a successful SSH connection test" >> ~/myname2.txt
          cd ~/emraay-airlines

          # Make sure we're on the right code
          git fetch origin
          git checkout github-actions
          git reset --hard origin/github-actions

          PID=$(sudo lsof -t -i TCP:3000 -s TCP:LISTEN || true)
          [ -n "$PID" ] && kill "$PID" || true
          sleep 2
          [ -n "$PID" ] && sudo kill -9 "$PID" 2>/dev/null || true

          # Clean install & build
          npm ci
          npm run build

          # Start Next.js in background, bind to loopback, capture logs
          nohup npm start -- -p 3000 -H 127.0.0.1 > /tmp/next.log 2>&1 &

          # Wait up to 30s for port 3000 to accept connections
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "App is up on 127.0.0.1:3000"
              break
            fi
            sleep 1
          done

          # If still not up, print logs and fail
          if ! curl -fsS http://127.0.0.1:3000/ >/dev/null; then
            echo "App failed to start; last 200 lines of /tmp/next.log:"
            tail -n 200 /tmp/next.log || true
            exit 1
          fi
        EOF

