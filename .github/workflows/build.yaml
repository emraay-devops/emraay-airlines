name: Build and Test Github Workflow

on:
  push:
    branches:
      - main
      - github-actions
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    # - name: test SSH connection
    #   run: | # ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} 'echo "This is a successful SSH connection test" >> myname2.txt'
    #     ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<EOF
    #       echo "This is a successful SSH connection test" >> myname2.txt
    #       cd emraay-airlines
    #       git pull origin github-actions
    #       git checkout github-actions
    #       npm install
    #       npm run build
    #       npm start &
    #       curl -f http://localhost:3000 || exit 1
          
    #       EOF
    - name: Deploy to EC2 (stop→build→start→verify)
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<'EOF'
          set -euo pipefail

          cd ~/emraay-airlines

          # --- 0) get latest code on the target branch ---
          git fetch origin
          git checkout github-actions
          git reset --hard origin/github-actions

          # --- 1) stop whatever is on :3000 ---
          sudo ss -ltnp | grep ':3000' || echo "nothing on 3000"
          sudo fuser -k 3000/tcp || true
          sudo ss -ltnp | grep ':3000' || echo "stopped: no listener on :3000"

          # --- 2) build fresh ---
          npm ci
          npm run build

          # --- 3) start Next.js (public test: bind to all interfaces) ---
          nohup npm start -- -p 3000 -H 0.0.0.0 > /tmp/next.log 2>&1 & echo $! > /tmp/next.pid
          sleep 2
          tail -n 50 /tmp/next.log || true

          # --- 4) verify listener & readiness ---
          sudo ss -ltnp | grep ':3000'
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "✅ App is up on 0.0.0.0:3000"
              exit 0
            fi
            sleep 1
          done

          echo "❌ App failed to start. Last 200 lines of /tmp/next.log:"
          tail -n 200 /tmp/next.log || true
          exit 1
        EOF

