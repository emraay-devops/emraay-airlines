name: Build and Test Github Workflow

on:
  push:
    branches:
      - main
      - github-actions
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4
    - uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to EC2 (stop→build→start→verify)
      run: |
        ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} <<'EOF'
          set -euo pipefail

          cd ~/emraay-airlines
          git fetch origin
          git checkout github-actions
          git reset --hard origin/github-actions

          # stop old listener (ok if none)
          set +e; sudo fuser -k 3000/tcp >/dev/null 2>&1; set -e

          npm ci
          npm run build

          nohup npm start -- -p 3000 -H 0.0.0.0 > /tmp/next.log 2>&1 & echo $! > /tmp/next.pid

          # ---- READINESS (no hard failures while waiting) ----
          timeout=120    # seconds
          start=$SECONDS
          until curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; do
            if [ $(( SECONDS - start )) -ge $timeout ]; then
              echo "❌ App not ready after ${timeout}s. Tail log:"; tail -n 200 /tmp/next.log || true
              exit 1
            fi
            sleep 1
          done
          echo "✅ App is up on 0.0.0.0:3000"
          exit 0
        EOF


